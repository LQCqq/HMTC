[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmtc-crystal"
version = "0.2.0"
description = "Initial Hyperbolic Multi-Tree generator for crystalline materials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
mp20 = ["pymatgen>=2024.1"]
evaluation = [
  "ase>=3.23",
  "pymatgen>=2024.1",
  "smact>=3.2.0",
]
mace = [
  "ase>=3.23",
  "mace-torch>=0.3.13",
  "pymatgen>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
